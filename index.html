<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Deteksi Ekspresi</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>

    <!-- Teachable Machine Image -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #webcam-container {
            margin-top: 20px;
        }

        #label-container {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>AI Deteksi Ekspresi</h1>

    <button onclick="init()">Mulai Kamera</button>

    <div id="webcam-container"></div>

    <div id="label-container"></div>

    <script>

        // Lokasi model
        const URL = "./";

        let model, webcam, labelContainer, maxPredictions;

        // Menjalankan kamera dan model AI
        async function init() {

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // Memuat model Teachable Machine
            model = await tmImage.load(modelURL, metadataURL);

            maxPredictions = model.getTotalClasses();

            // Membuat kamera
            const flip = true;

            webcam = new tmImage.Webcam(300, 300, flip);

            await webcam.setup();

            await webcam.play();

            window.requestAnimationFrame(loop);

            // Menampilkan kamera
            document.getElementById("webcam-container")
                .appendChild(webcam.canvas);

            // Tempat hasil prediksi
            labelContainer =
                document.getElementById("label-container");

            for (let i = 0; i < maxPredictions; i++) {

                labelContainer.appendChild(
                    document.createElement("div")
                );

            }
        }

        // Membaca kamera secara terus-menerus
        async function loop() {

            webcam.update();

            await predict();

            window.requestAnimationFrame(loop);
        }

        // Melakukan prediksi
        async function predict() {

            const prediction =
                await model.predict(webcam.canvas);

            for (let i = 0; i < maxPredictions; i++) {

                const classPrediction =
                    prediction[i].className +
                    ": " +
                    (prediction[i].probability * 100)
                    .toFixed(2) +
                    "%";

                labelContainer.childNodes[i]
                    .innerHTML = classPrediction;
            }
        }

    </script>

</body>
</html>
